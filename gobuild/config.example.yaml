proxy:
  listen: "0.0.0.0:22"
  host_keys:
    - /etc/ssh-proxy/host_ed25519
    - /etc/ssh-proxy/host_rsa
  algorithms:
    kex:
      - curve25519-sha256
      - ecdh-sha2-nistp521
      - ecdh-sha2-nistp384
      - ecdh-sha2-nistp256
      - diffie-hellman-group14-sha256
      - diffie-hellman-group14-sha1
    ciphers:
      - chacha20-poly1305@openssh.com
      - aes256-gcm@openssh.com
      - aes128-gcm@openssh.com
      - aes256-ctr
      - aes192-ctr
      - aes128-ctr
    macs:
      - hmac-sha2-512-etm@openssh.com
      - hmac-sha2-256-etm@openssh.com
      - hmac-sha2-512
      - hmac-sha2-256
      - hmac-sha1
    host_key_algos:
      - ssh-ed25519
      - ecdsa-sha2-nistp521
      - ecdsa-sha2-nistp384
      - ecdsa-sha2-nistp256
      - rsa-sha2-512
      - rsa-sha2-256
      - ssh-rsa

proxy_credentials:
  private_key: /etc/ssh-proxy/proxy_id_rsa

sftp:
  # Applied to the vendored x/crypto/ssh fork used by this proxy for server and
  # backend client channels. Remote peers still advertise their own limits.
  window_size: 67108864
  max_packet_size: 262144
  max_concurrent_requests: 64

timeouts:
  backend_connect: 10s
  backend_handshake: 15s
  keepalive_interval: 30s
  keepalive_count_max: 3

backends:
  nas:
    host: 192.168.2.10
    port: 22
    private_key: /etc/ssh-proxy/keys/nas_id_rsa
    fallback_to_password: true
  vm:
    host: 192.168.2.30
    port: 2222
    private_key: /etc/ssh-proxy/keys/vm_id_rsa
    fallback_to_password: false
  computer1:
    host: 192.168.2.50
    port: 22
    fallback_to_password: true

rules:
  - name: "user1-vm-keyonly"
    match: "^user1-vm$"
    backend: vm
    backend_username: "user1"
    require_pubkey: true
  - name: "admin-nas-keyonly"
    match: "^admin-nas$"
    backend: nas
    backend_username: "administrator"
    require_pubkey: true
  - name: "nas-wildcard"
    match: "^(.*)-nas$"
    backend: nas
    backend_username: "$1"
  - name: "vm-wildcard"
    match: "^(.*)-vm$"
    backend: vm
    backend_username: "$1"
  - name: "computer1-wildcard"
    match: "^(.*)-computer1$"
    backend: computer1
    backend_username: "$1"

metrics:
  enabled: true
  listen: "0.0.0.0:9090"
  path: "/metrics"

logging:
  level: info
  format: json
  output: stdout
